		Cash: 500
	SupplyManager:
		Max: 120
	TechTree:
	WeaverManager:
	PlaceBuilding:
	Shroud:
		Interval: 5
	PlayerStatistics:
	BaseAttackNotifier:
		Interval: 300
	ConquestVictoryConditions:
	GrantBotConditions:
	BotProfile@easy:
		RequiresCondition: bot-easy
		ThinkInterval: 40
		HarvestBonus: 70
		FirstWave: 8250
		WaveBase: 16
		WaveGrow: 6
		MaxFoundries: 2
