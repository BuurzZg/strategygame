# Player actor: one per player. Bot modules switch on through conditions granted for bots.

Player:
	PlayerResources:
		Cash: 500
	SupplyManager:
		Max: 120
	TechTree:
	WeaverManager:
	PlaceBuilding:
	Shroud:
		Interval: 5
	PlayerStatistics:
	BaseAttackNotifier:
		Interval: 300
	GrantConditionOnSetting@mission:
		Setting: mission
		Condition: mission
	ConquestVictoryConditions:
		RequiresCondition: !mission
	MissionObjectives:
		RequiresCondition: mission
	GrantBotConditions:
	BotProfile@passive:
		RequiresCondition: bot-passive
		ThinkInterval: 25
		HarvestBonus: 100
	BotProfile@autopilot:
		RequiresCondition: bot-autopilot
		ThinkInterval: 15
		HarvestBonus: 100
		FirstWave: 2500
		WaveBase: 18
		WaveGrow: 6
		MaxFoundries: 5
		AttackRatio: 115
		RetreatRatio: 55
		ExpandAfter: 1200
		SkimmersPerDropoff: 5
	BotProfile@easy:
		RequiresCondition: bot-easy
		ThinkInterval: 40
		HarvestBonus: 70
		FirstWave: 8250
		WaveBase: 16
		WaveGrow: 6
		MaxFoundries: 2
	BotProfile@normal:
		RequiresCondition: bot-normal
		ThinkInterval: 25
		HarvestBonus: 100
		FirstWave: 6500
		WaveBase: 20
		WaveGrow: 8
		MaxFoundries: 3
	BotProfile@hard:
		RequiresCondition: bot-hard
		ThinkInterval: 15
		HarvestBonus: 130
		FirstWave: 5000
		WaveBase: 18
		WaveGrow: 10
		MaxFoundries: 4
		AttackRatio: 100
		RetreatRatio: 55
	HarvesterBotModule:
		RequiresCondition: bot
	BaseBuilderBotModule:
		RequiresCondition: bot && !bot-passive
	UnitBuilderBotModule:
		RequiresCondition: bot && !bot-passive
		UnitShares:
			needle: 22
			warden: 48
			mender: 10
			bastion: 20
	SquadManagerBotModule:
		RequiresCondition: bot && !bot-passive
