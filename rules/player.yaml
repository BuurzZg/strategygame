		WaveBase: 20
		WaveGrow: 8
		MaxFoundries: 3
	BotProfile@hard:
		RequiresCondition: bot-hard
		ThinkInterval: 15
		HarvestBonus: 130
		FirstWave: 5000
		WaveBase: 18
		WaveGrow: 10
		MaxFoundries: 4
	HarvesterBotModule:
		RequiresCondition: bot
	BaseBuilderBotModule:
		RequiresCondition: bot
	UnitBuilderBotModule:
		RequiresCondition: bot
		UnitShares:
			needle: 22
			warden: 48
			mender: 10
			bastion: 20
	SquadManagerBotModule:
		RequiresCondition: bot
