Mission:
	Title: Furnace Line
	Tagline: Break the Combine's forward base.
	Location: The Furnace Line, east of the shelf
	Briefing@1: The Deep Drill sits behind the Furnace Line, a ridge of fused glass the Combine has fortified for a month. Quill's forward base there builds everything that has been hitting us.
	Briefing@2: You have a Core and a small garrison in the south-west. Build up, then destroy their Core and every Foundry they own. Without them, the drill site is exposed.
	Briefing@3: The centre of the valley holds the richest vent we have seen. A Siphon there would pay for this war.
	Objective@1: Destroy the Combine Core and every Foundry
	Objective@2: Hold the central vent with a Siphon (optional)
	Debrief@1: The forward base is burning. Prisoners say Quill pulled his best crews back to the drill site and has stopped answering his own captains.
	Debrief@2: Aune is worried. The vent song has started to drift out of tune, all across the shelf at once.
	FailText: The Combine has overrun our positions on the Furnace Line.
