Mission:
	Title: Choir Station
	Tagline: Hold the line while the vent sings.
	Location: Centre of the Ninefold Shelf
	Briefing@1: Dr. Aune has set up a listening Siphon beside the big central vent. He calls it Choir Station, and he believes the sound coming out of that vent is not noise.
	Briefing@2: He needs six uninterrupted minutes of recordings. The Combine has already filed a claim on the vent and will not let us sit there quietly.
	Briefing@3: Your base is already woven to the west. Keep Choir Station standing until the recording finishes. Prism Spires near the station would help.
	Objective@1: Keep Choir Station standing for six minutes
	Objective@2: Weave two Prism Spires (optional)
	Debrief@1: Aune has his recording. Slowed down, the vent repeats the same phrase every eleven seconds, and other vents across the shelf answer it.
	Debrief@2: He has started calling the whole network the Choir. The Combine has started moving heavy equipment north.
	FailText: Choir Station was destroyed and the recording is lost.
