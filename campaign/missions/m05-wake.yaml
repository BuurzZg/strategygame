Mission:
	Title: Wake
	Tagline: Stop the Deep Drill before it breaks the Choir.
	Location: Quill's drill site, beyond the Furnace Line
	Briefing@1: The Deep Drill is through the crust. Aune's models say that when it reaches the lattice the whole network fails at once, and every vent on Veyl goes dark. So does every crew standing near one.
	Briefing@2: Quill has dug in around the drill with everything he has left. An orbital Uplink keeps dropping reinforcements onto his perimeter. Take it out if you can.
	Briefing@3: The disturbance is also whipping up glass storms across the dunes. Light units caught in one will not come out. Watch for the warnings and get clear.
	Briefing@4: This is the end of it, Halcyon. Destroy the Deep Drill.
	Objective@1: Destroy the Deep Drill before it breaches
	Objective@2: Destroy the Combine Uplink to stop reinforcement drops (optional)
	Debrief@1: The Deep Drill has collapsed into its own shaft. The storms are dying down.
	FailText: The Deep Drill reached the lattice. Across Veyl, the vents have fallen silent.
