Mission:
	Title: Glass Shadows
	Tagline: No base, no backup. Cut the drill's relays.
	Location: The Obsidian Reach
	Briefing@1: Aune's recordings picked up something else under the song, a deep mechanical rhythm. The Combine is boring into the lattice somewhere north of the Reach.
	Briefing@2: They are steering the bore through three relay Uplinks hidden in the obsidian canyons. Lieutenant Lind will lead a strike team in on foot. There is no room to land a Core in there.
	Briefing@3: Destroy all three relays. A survey crew went missing in the Reach last week. If they are alive, bring them home.
	Objective@1: Destroy the three drill relays
	Objective@2: Find the missing survey crew (optional)
	Debrief@1: With the relays down, the Combine has lost the guidance on its bore. Quill will have to run it by hand from the drill site itself.
	Debrief@2: Aune finally has a location. The Combine calls it the Deep Drill, and it sits on the far side of the Furnace Line.
	FailText: Lieutenant Lind's strike team was lost in the Reach.
