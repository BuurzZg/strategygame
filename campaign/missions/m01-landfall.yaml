Mission:
	Title: Landfall
	Tagline: The beacon went quiet. Find out why.
	Location: Ninefold Shelf, northern dunes
	Briefing@1: Survey Group Halcyon, welcome to Veyl. Your drop pods are down on the Ninefold Shelf, a day's walk from the richest vent field we have charted.
	Briefing@2: We dropped a survey beacon ahead of you. It stopped transmitting an hour ago. Take your Wardens and Needles north-east and find out what happened to it.
	Briefing@3: Once the area is secure I will send down your Core. From there you can weave a base, put Skimmers on the vents and start earning your keep.
	Objective@1: Secure the survey beacon
	Objective@2: Weave a Foundry
	Objective@3: Destroy the Combine scrap camp
	Debrief@1: The scrap camp is glass dust and the beacon is singing again. The Combine knows we are here now.
	Debrief@2: Dr. Aune has asked for an escort to the big vent in the middle of the shelf. He says it is louder than the others.
	FailText: Survey Group Halcyon has been scattered. Command is pulling the landing back to orbit.
